specVersion: v0.1.0
package:
  name: solana-spl-all-tokens
  version: v0.1.0
  url: https://github.com/streamingfast/substreams-spl-all-tokens

imports:
  solana_common: https://github.com/streamingfast/substreams-foundational-modules/releases/download/solana-common-v0.3.0/solana-common-v0.3.0.spkg

protobuf:
  files:
    - sf/solana/v1/spl/type/spl.proto
    - parquet/options.proto
  descriptorSets:
    - module: buf.build/streamingfast/substreams-sink-sql
  excludePaths:
    #    - sf/substreams
    - google
  importPaths:
    - ./proto

binaries:
  default:
    type: wasm/rust-v1
    file: target/wasm32-unknown-unknown/release/substreams_hivemapper.wasm

modules:
  - name: map_spl_instructions
    kind: map
    initialBlock: 31310775
    inputs:
      - params: string
      - map: solana_common:transactions_by_programid_without_votes
    output:
      type: proto:sf.solana.spl.v1.type.SplInstructions

network: solana

params:
  solana_common:transactions_by_programid_without_votes: "program:TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA || program:TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb"

sink:
  module: map_spl_instructions
  type: sf.substreams.sink.sql.v1.Service
  config:
    dbt_config:
      files: ./dbt
      run_interval_seconds: 300
      enabled: false